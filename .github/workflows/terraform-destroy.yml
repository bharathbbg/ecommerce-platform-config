name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (staging, production)'
        required: true
        default: 'staging'
      confirmation:
        description: 'Type "destroy" to confirm you want to destroy the infrastructure'
        required: true

jobs:
  terraform:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirmation == 'destroy' }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.0.0

    - name: Configure GCP Credentials
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    - name: Terraform Init
      run: make tf-init ENV=${{ github.event.inputs.environment }}

    - name: Terraform Destroy
      run: make tf-destroy ENV=${{ github.event.inputs.environment }}