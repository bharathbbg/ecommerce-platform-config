name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (staging, production)'
        required: true
        default: 'staging'

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.0.0

    - name: Configure GCP Credentials
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    - name: Terraform Init
      run: make tf-init ENV=${{ github.event.inputs.environment }}
      
    - name: Terraform Validate
      run: make tf-validate

    - name: Terraform Plan
      run: make tf-plan ENV=${{ github.event.inputs.environment }}

    - name: Terraform Apply
      run: make tf-apply ENV=${{ github.event.inputs.environment }}