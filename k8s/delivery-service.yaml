apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: ecommerce-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      containers:
      - name: delivery-service
        image: gcr.io/ecommerce-platform-475712/delivery-service:latest
        ports:
        - containerPort: 8081
          name: http
        - containerPort: 50052
          name: grpc
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: postgres_host
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: postgres_password
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: ecommerce-platform
spec:
  selector:
    app: delivery-service
  ports:
  - port: 8081
    targetPort: 8081
    name: http
  - port: 50052
    targetPort: 50052
    name: grpc
  type: ClusterIP