apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecommerce-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: gcr.io/ecommerce-platform-475712/inventory-service:latest
        ports:
        - containerPort: 8082
          name: http
        - containerPort: 50053
          name: grpc
        env:
        - name: MONGODB_HOST
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: mongodb_host
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: mongodb_password
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ecommerce-platform
spec:
  selector:
    app: inventory-service
  ports:
  - port: 8082
    targetPort: 8082
    name: http
  - port: 50053
    targetPort: 50053
    name: grpc
  type: ClusterIP