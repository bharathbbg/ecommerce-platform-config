apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: gcr.io/ecommerce-platform-475712/order-service:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 50051
          name: grpc
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: postgres_host
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: postgres_password
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: redis_host
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce-platform
spec:
  selector:
    app: order-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 50051
    targetPort: 50051
    name: grpc
  type: ClusterIP